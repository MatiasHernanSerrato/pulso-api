run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - gocritic
    - revive
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck
    - nilerr
    - errorlint

linters-settings:
  goimports:
    local-prefixes: github.com/MatiasHernanSerrato/pulso-api
  revive:
    rules:
      - name: exported
        disabled: true
      - name: var-naming
      - name: if-return
      - name: early-return
      - name: unreachable-code
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam
      - rangeValCopy
  errcheck:
    exclude-functions:
      - (net/http.ResponseWriter).Write
      - encoding/json.Encoder.Encode

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gocritic
